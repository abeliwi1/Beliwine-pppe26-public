    <text x="260.0" y="395.0" font-size="15" text-anchor="middle" fill="#222">fib(0)</text>
    <line x1="700.0" y1="380.0" x2="750.0" y2="380.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#m2b6cb0)"/>
    <text x="760.0" y="385.0" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">cilk_spawn fib(n-1)</text>
    <line x1="700.0" y1="412.0" x2="750.0" y2="412.0" stroke="#c05621" stroke-width="2.5" marker-end="url(#mc05621)"/>
    <text x="760.0" y="417.0" font-size="13" text-anchor="start" fill="#c05621" font-weight="bold">continuation: fib(n-2)</text>
    <rect x="700.0" y="430.0" width="50.0" height="26.0" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="760.0" y="448.0" font-size="13" text-anchor="start" fill="#555">base case, returns at once</text>
  </g>
</svg>
