<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A tree of calls. fib(4) spawns fib(3) and continues with fib(2); fib(3) spawns fib(2) and continues with fib(1); each fib(2) spawns fib(1) and continues with fib(0). Spawn edges are blue and continuation edges are orange. Calls with no path between them may run at the same time.">
  <defs><marker id="m2b6cb0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="mc05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
  <rect width="1000" height="470" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="32" font-size="19" font-weight="bold" text-anchor="middle">The DAG of fib(4)</text>
    <line x1="500.0" y1="110.0" x2="300.0" y2="168.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#m2b6cb0)"/>
    <line x1="500.0" y1="110.0" x2="700.0" y2="168.0" stroke="#c05621" stroke-width="2.5" marker-end="url(#mc05621)"/>
