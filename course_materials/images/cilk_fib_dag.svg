    <line x1="300.0" y1="210.0" x2="420.0" y2="268.0" stroke="#c05621" stroke-width="2.5" marker-end="url(#mc05621)"/>
    <line x1="700.0" y1="210.0" x2="600.0" y2="268.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#m2b6cb0)"/>
    <line x1="700.0" y1="210.0" x2="800.0" y2="268.0" stroke="#c05621" stroke-width="2.5" marker-end="url(#mc05621)"/>
    <line x1="180.0" y1="310.0" x2="100.0" y2="368.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#m2b6cb0)"/>
    <line x1="180.0" y1="310.0" x2="260.0" y2="368.0" stroke="#c05621" stroke-width="2.5" marker-end="url(#mc05621)"/>
    <rect x="450.0" y="70.0" width="100.0" height="40.0" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
    <text x="500.0" y="95.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">fib(4)</text>
    <rect x="250.0" y="170.0" width="100.0" height="40.0" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
    <text x="300.0" y="195.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">fib(3)</text>
    <rect x="650.0" y="170.0" width="100.0" height="40.0" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
    <text x="700.0" y="195.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">fib(2)</text>
    <rect x="130.0" y="270.0" width="100.0" height="40.0" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
    <text x="180.0" y="295.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">fib(2)</text>
    <rect x="370.0" y="270.0" width="100.0" height="40.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="420.0" y="295.0" font-size="15" text-anchor="middle" fill="#222">fib(1)</text>
    <rect x="550.0" y="270.0" width="100.0" height="40.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="600.0" y="295.0" font-size="15" text-anchor="middle" fill="#222">fib(1)</text>
    <rect x="750.0" y="270.0" width="100.0" height="40.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="800.0" y="295.0" font-size="15" text-anchor="middle" fill="#222">fib(0)</text>
    <rect x="50.0" y="370.0" width="100.0" height="40.0" rx="8" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="100.0" y="395.0" font-size="15" text-anchor="middle" fill="#222">fib(1)</text>
