<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="The main thread runs serially, forks a team of four threads at a parallel region, and every thread runs the region. Threads that finish early wait at the barrier at the end of the region. Then only the main thread continues.">
  <defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <rect width="1000" height="400" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="32" font-size="19" font-weight="bold" text-anchor="middle">Fork and join</text>
    <line x1="40.0" y1="120.0" x2="230.0" y2="120.0" stroke="#222" stroke-width="4"/>
    <line x1="800.0" y1="120.0" x2="960.0" y2="120.0" stroke="#222" stroke-width="4" marker-end="url(#m222)"/>
    <text x="135.0" y="106.0" font-size="13" text-anchor="middle" fill="#222">main thread</text>
    <text x="880.0" y="106.0" font-size="13" text-anchor="middle" fill="#222">main thread</text>
    <path d="M 230 120 C 255 120, 245 175, 275 175" fill="none" stroke="#555" stroke-width="1.5"/>
    <path d="M 230 120 C 255 120, 245 230, 275 230" fill="none" stroke="#555" stroke-width="1.5"/>
    <path d="M 230 120 C 255 120, 245 285, 275 285" fill="none" stroke="#555" stroke-width="1.5"/>
    <rect x="230.0" y="107.0" width="560.0" height="26.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="242.0" y="125.0" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="bold">thread 0 (the main thread)</text>
    <rect x="275.0" y="162.0" width="365.0" height="26.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="287.0" y="180.0" font-size="13" text-anchor="start" fill="#c05621" font-weight="bold">thread 1</text>
    <line x1="644.0" y1="175.0" x2="794.0" y2="175.0" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="720.0" y="167.0" font-size="12" text-anchor="middle" fill="#555" font-style="italic">waits</text>
    <rect x="275.0" y="217.0" width="515.0" height="26.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="287.0" y="235.0" font-size="13" text-anchor="start" fill="#2f855a" font-weight="bold">thread 2</text>
    <rect x="275.0" y="272.0" width="245.0" height="26.0" rx="4" fill="#e9e3f7" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="287.0" y="290.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="bold">thread 3</text>
    <line x1="524.0" y1="285.0" x2="794.0" y2="285.0" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="660.0" y="277.0" font-size="12" text-anchor="middle" fill="#555" font-style="italic">waits</text>
    <line x1="800.0" y1="90.0" x2="800.0" y2="310.0" stroke="#222" stroke-width="3"/>
    <text x="800.0" y="330.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">barrier: join</text>
    <line x1="230.0" y1="90.0" x2="230.0" y2="310.0" stroke="#555" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="230.0" y="330.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">fork</text>
    <text x="135.0" y="365.0" font-size="14" text-anchor="middle" fill="#555">serial</text>
    <text x="515.0" y="365.0" font-size="14" text-anchor="middle" fill="#555">parallel region: every thread runs it</text>
    <text x="880.0" y="365.0" font-size="14" text-anchor="middle" fill="#555">serial</text>
  </g>
</svg>
