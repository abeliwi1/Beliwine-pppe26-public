<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Nine elements a through i in three blocks of three, one per thread. Pass 1: each thread scans its own block and saves its total. Pass 2: one thread scans the three totals into offsets 0, a+b+c, and a+b+c+d+e+f. Pass 3: each thread adds its block&#x27;s offset to every element of its block.">
  <defs><marker id="m2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="m555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="mc05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
  <rect width="1000" height="560" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="32" font-size="19" font-weight="bold" text-anchor="middle">Scan, then add: three passes over blocks</text>
    <text x="110.0" y="93.0" font-size="14" text-anchor="end" fill="#222" font-weight="bold">in</text>
    <rect x="130.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="171.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">a</text>
    <rect x="216.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="257.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">b</text>
    <rect x="302.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="343.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">c</text>
    <rect x="406.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="447.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">d</text>
    <rect x="492.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="533.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">e</text>
    <rect x="578.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="619.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">f</text>
    <rect x="682.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="723.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">g</text>
    <rect x="768.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="809.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">h</text>
    <rect x="854.0" y="70.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="895.0" y="93.0" font-size="13" text-anchor="middle" fill="#222">i</text>
    <text x="257.0" y="128.0" font-size="13" text-anchor="middle" fill="#2b6cb0" font-weight="bold">thread 0</text>
    <text x="533.0" y="128.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="bold">thread 1</text>
    <text x="809.0" y="128.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="bold">thread 2</text>
    <text x="110.0" y="163.0" font-size="14" text-anchor="end" fill="#222" font-weight="bold">pass 1</text>
    <rect x="130.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="171.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">a</text>
    <rect x="216.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="257.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">a+b</text>
    <rect x="302.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="343.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">a+b+c</text>
    <rect x="406.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="447.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">d</text>
    <rect x="492.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="533.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">d+e</text>
    <rect x="578.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="619.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">d+e+f</text>
    <rect x="682.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="723.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">g</text>
    <rect x="768.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="809.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">g+h</text>
    <rect x="854.0" y="140.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="895.0" y="163.0" font-size="13" text-anchor="middle" fill="#222">g+h+i</text>
    <text x="110.0" y="253.0" font-size="14" text-anchor="end" fill="#222" font-weight="bold">pass 2</text>
    <rect x="130.0" y="230.0" width="120.0" height="36.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="190.0" y="253.0" font-size="13" text-anchor="middle" fill="#222">a+b+c</text>
    <rect x="260.0" y="230.0" width="120.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="320.0" y="253.0" font-size="13" text-anchor="middle" fill="#222">d+e+f</text>
    <rect x="390.0" y="230.0" width="120.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="450.0" y="253.0" font-size="13" text-anchor="middle" fill="#222">g+h+i</text>
    <text x="540.0" y="245.0" font-size="12" text-anchor="start" fill="#555">one thread scans the block totals</text>
    <text x="540.0" y="263.0" font-size="12" text-anchor="start" fill="#555">into offsets: each block&#x27;s offset is the sum</text>
    <text x="540.0" y="281.0" font-size="12" text-anchor="start" fill="#555">of every block before it</text>
    <rect x="130.0" y="300.0" width="120.0" height="36.0" rx="4" fill="#fff" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="190.0" y="323.0" font-size="13" text-anchor="middle" fill="#222">offset 0</text>
    <rect x="260.0" y="300.0" width="120.0" height="36.0" rx="4" fill="#fff" stroke="#c05621" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="320.0" y="323.0" font-size="13" text-anchor="middle" fill="#222">offset a+b+c</text>
    <line x1="190.0" y1="268.0" x2="300.0" y2="298.0" stroke="#555" stroke-width="1.3" marker-end="url(#m555)"/>
    <line x1="250.0" y1="318.0" x2="258.0" y2="318.0" stroke="#555" stroke-width="1.3" marker-end="url(#m555)"/>
    <rect x="390.0" y="300.0" width="120.0" height="36.0" rx="4" fill="#fff" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="450.0" y="323.0" font-size="13" text-anchor="middle" fill="#222">offset a+…+f</text>
    <line x1="320.0" y1="268.0" x2="430.0" y2="298.0" stroke="#555" stroke-width="1.3" marker-end="url(#m555)"/>
    <line x1="380.0" y1="318.0" x2="388.0" y2="318.0" stroke="#555" stroke-width="1.3" marker-end="url(#m555)"/>
    <text x="110.0" y="423.0" font-size="14" text-anchor="end" fill="#222" font-weight="bold">pass 3</text>
    <rect x="130.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="171.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a</text>
    <rect x="216.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="257.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+b</text>
    <rect x="302.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="343.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+b+c</text>
    <rect x="406.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="447.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+…+d</text>
    <rect x="492.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="533.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+…+e</text>
    <rect x="578.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="619.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+…+f</text>
    <rect x="682.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="723.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+…+g</text>
    <rect x="768.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="809.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+…+h</text>
    <rect x="854.0" y="400.0" width="82.0" height="36.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="895.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">a+…+i</text>
    <line x1="320.0" y1="338.0" x2="533.0" y2="396.0" stroke="#c05621" stroke-width="1.8" marker-end="url(#mc05621)"/>
    <line x1="450.0" y1="338.0" x2="809.0" y2="396.0" stroke="#2f855a" stroke-width="1.8" marker-end="url(#m2f855a)"/>
    <text x="500.0" y="490.0" font-size="14" text-anchor="middle" fill="#222">Every block&#x27;s pass 1 and pass 3 run in parallel; pass 2 is only one number per block.</text>
    <text x="500.0" y="515.0" font-size="14" text-anchor="middle" fill="#222">About 2N additions in all, against the serial N − 1.</text>
  </g>
</svg>
