<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A race on a shared increment. The shared counter count holds 17 in memory. Thread B loads 17, then thread A loads 17. Each adds 1 and gets 18. Thread B stores 18, then thread A stores 18. Two increments should leave 19, but memory holds 18: thread A's store overwrote thread B's, and one increment is lost.">
  <defs>
    <marker id="tipb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="tipa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="30" font-size="19" font-weight="bold" text-anchor="middle">Two threads increment one shared counter</text>
    <text x="500" y="52" font-size="13" text-anchor="middle" fill="#555">count++ is three steps: load, add, store. When the steps of two threads interleave, one increment is lost.</text>

    <!-- lanes -->
    <rect x="160" y="80" width="810" height="70" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <rect x="160" y="190" width="810" height="70" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
    <rect x="160" y="330" width="810" height="60" rx="6" fill="#fff" stroke="#999" stroke-width="1.5"/>

    <text x="145" y="122" font-size="16" font-weight="bold" text-anchor="end" fill="#2b6cb0">thread B</text>
    <text x="145" y="232" font-size="16" font-weight="bold" text-anchor="end" fill="#c05621">thread A</text>
    <text x="145" y="357" font-size="16" font-weight="bold" text-anchor="end">count</text>
    <text x="145" y="375" font-size="12" text-anchor="end" fill="#555">(memory)</text>

    <!-- thread B: load 17, add -->
    <text x="240" y="127" font-size="20" font-weight="bold" text-anchor="middle">17</text>
    <text x="450" y="101" font-size="12" text-anchor="middle" fill="#555">add</text>
    <text x="450" y="127" font-size="20" font-weight="bold" text-anchor="middle">17 + 1 = 18</text>

    <!-- thread A: load 17, add -->
    <text x="340" y="237" font-size="20" font-weight="bold" text-anchor="middle">17</text>
    <text x="580" y="211" font-size="12" text-anchor="middle" fill="#555">add</text>
    <text x="580" y="237" font-size="20" font-weight="bold" text-anchor="middle">17 + 1 = 18</text>

    <!-- memory -->
    <text x="200" y="368" font-size="20" font-weight="bold" text-anchor="middle">17</text>
    <text x="680" y="368" font-size="20" font-weight="bold" text-anchor="middle">18</text>
    <text x="765" y="368" font-size="20" font-weight="bold" text-anchor="middle">18</text>
    <text x="808" y="355" font-size="13" font-weight="bold" fill="#b83232">should be 19:</text>
    <text x="808" y="373" font-size="13" font-weight="bold" fill="#b83232">B's increment is lost</text>

    <!-- loads: memory up to the thread -->
    <line x1="240" y1="330" x2="240" y2="153" stroke="#2b6cb0" stroke-width="2" marker-end="url(#tipb)"/>
    <text x="248" y="300" font-size="13" fill="#2b6cb0">1. load</text>
    <line x1="340" y1="330" x2="340" y2="263" stroke="#c05621" stroke-width="2" marker-end="url(#tipa)"/>
    <text x="348" y="300" font-size="13" fill="#c05621">2. load</text>

    <!-- stores: thread down to memory -->
    <line x1="680" y1="150" x2="680" y2="327" stroke="#2b6cb0" stroke-width="2" marker-end="url(#tipb)"/>
    <text x="688" y="300" font-size="13" fill="#2b6cb0">3. store</text>
    <line x1="765" y1="260" x2="765" y2="327" stroke="#c05621" stroke-width="2" marker-end="url(#tipa)"/>
    <text x="773" y="300" font-size="13" fill="#c05621">4. store</text>

    <!-- time -->
    <line x1="400" y1="428" x2="680" y2="428" stroke="#333" stroke-width="2" marker-end="url(#tip)"/>
    <text x="540" y="452" font-size="14" font-weight="bold" text-anchor="middle">time</text>
  </g>
</svg>
