<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Two interleavings of count++ in x86 assembly, by threads A and B; count starts at 17. Each increment is three instructions: mov rax, [count] loads count into the thread's own rax register; add rax, 1 adds one; mov [count], rax stores it back. Left panel, serial: thread A loads 17, adds to get 18, stores 18; then thread B loads 18, adds to get 19, stores 19. count ends at 19, which is correct. Right panel, interleaved: thread B loads 17, thread A loads 17, B adds to get 18, A adds to get 18, B stores 18, A stores 18. count ends at 18: A's store overwrote B's, and B's increment is lost.">
  <rect width="1000" height="480" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="30" font-size="19" font-weight="bold" text-anchor="middle">count++ in x86 assembly, two ways to interleave</text>
    <text x="500" y="52" font-size="13" text-anchor="middle" fill="#555">Each thread has its own rax register; count is shared memory, and starts at 17. Time runs down.</text>

    <!-- ===== left panel: serial ===== -->
    <rect x="15" y="68" width="480" height="392" rx="8" fill="#fcfcfb" stroke="#ddd"/>
    <text x="255" y="94" font-size="15" font-weight="bold" text-anchor="middle">Serial: one increment, then the other</text>
    <text x="35" y="124" font-size="12" text-anchor="middle" fill="#555">step</text>
    <text x="140" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#c05621">thread A</text>
    <text x="320" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b6cb0">thread B</text>
    <text x="450" y="124" font-size="14" font-weight="bold" text-anchor="middle">count</text>

    <g font-size="13">
      <!-- 1: A load -->
      <text x="35" y="160" text-anchor="middle" fill="#555">1</text>
      <rect x="55" y="136" width="170" height="38" rx="4" fill="#fdf0e6" stroke="#c05621"/>
      <text x="140" y="153" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov rax, [count]</text>
      <text x="140" y="168" font-size="11" text-anchor="middle" fill="#555">rax = 17</text>
      <text x="450" y="160" font-size="16" text-anchor="middle">17</text>
      <!-- 2: A add -->
      <text x="35" y="204" text-anchor="middle" fill="#555">2</text>
      <rect x="55" y="180" width="170" height="38" rx="4" fill="#fdf0e6" stroke="#c05621"/>
      <text x="140" y="197" text-anchor="middle" font-family="Menlo, Consolas, monospace">add rax, 1</text>
      <text x="140" y="212" font-size="11" text-anchor="middle" fill="#555">rax = 18</text>
      <text x="450" y="204" font-size="16" text-anchor="middle">17</text>
      <!-- 3: A store -->
      <text x="35" y="248" text-anchor="middle" fill="#555">3</text>
      <rect x="55" y="224" width="170" height="38" rx="4" fill="#fdf0e6" stroke="#c05621"/>
      <text x="140" y="241" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov [count], rax</text>
      <text x="140" y="256" font-size="11" text-anchor="middle" fill="#555">writes 18</text>
      <text x="450" y="248" font-size="16" font-weight="bold" text-anchor="middle">18</text>
      <!-- 4: B load -->
      <text x="35" y="292" text-anchor="middle" fill="#555">4</text>
      <rect x="235" y="268" width="170" height="38" rx="4" fill="#eef4fb" stroke="#2b6cb0"/>
      <text x="320" y="285" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov rax, [count]</text>
      <text x="320" y="300" font-size="11" text-anchor="middle" fill="#555">rax = 18</text>
      <text x="450" y="292" font-size="16" text-anchor="middle">18</text>
      <!-- 5: B add -->
      <text x="35" y="336" text-anchor="middle" fill="#555">5</text>
      <rect x="235" y="312" width="170" height="38" rx="4" fill="#eef4fb" stroke="#2b6cb0"/>
      <text x="320" y="329" text-anchor="middle" font-family="Menlo, Consolas, monospace">add rax, 1</text>
      <text x="320" y="344" font-size="11" text-anchor="middle" fill="#555">rax = 19</text>
      <text x="450" y="336" font-size="16" text-anchor="middle">18</text>
      <!-- 6: B store -->
      <text x="35" y="380" text-anchor="middle" fill="#555">6</text>
      <rect x="235" y="356" width="170" height="38" rx="4" fill="#eef4fb" stroke="#2b6cb0"/>
      <text x="320" y="373" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov [count], rax</text>
      <text x="320" y="388" font-size="11" text-anchor="middle" fill="#555">writes 19</text>
      <text x="450" y="380" font-size="16" font-weight="bold" text-anchor="middle">19</text>
    </g>
    <text x="255" y="432" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f855a">count = 19: correct</text>

    <!-- ===== right panel: interleaved ===== -->
    <rect x="505" y="68" width="480" height="392" rx="8" fill="#fcfcfb" stroke="#ddd"/>
    <text x="745" y="94" font-size="15" font-weight="bold" text-anchor="middle">Interleaved: a lost write</text>
    <text x="525" y="124" font-size="12" text-anchor="middle" fill="#555">step</text>
    <text x="630" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#c05621">thread A</text>
    <text x="810" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b6cb0">thread B</text>
    <text x="940" y="124" font-size="14" font-weight="bold" text-anchor="middle">count</text>

    <g font-size="13">
      <!-- 1: B load -->
      <text x="525" y="160" text-anchor="middle" fill="#555">1</text>
      <rect x="725" y="136" width="170" height="38" rx="4" fill="#eef4fb" stroke="#2b6cb0"/>
      <text x="810" y="153" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov rax, [count]</text>
      <text x="810" y="168" font-size="11" text-anchor="middle" fill="#555">rax = 17</text>
      <text x="940" y="160" font-size="16" text-anchor="middle">17</text>
      <!-- 2: A load -->
      <text x="525" y="204" text-anchor="middle" fill="#555">2</text>
      <rect x="545" y="180" width="170" height="38" rx="4" fill="#fdf0e6" stroke="#c05621"/>
      <text x="630" y="197" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov rax, [count]</text>
      <text x="630" y="212" font-size="11" text-anchor="middle" fill="#555">rax = 17</text>
      <text x="940" y="204" font-size="16" text-anchor="middle">17</text>
      <!-- 3: B add -->
      <text x="525" y="248" text-anchor="middle" fill="#555">3</text>
      <rect x="725" y="224" width="170" height="38" rx="4" fill="#eef4fb" stroke="#2b6cb0"/>
      <text x="810" y="241" text-anchor="middle" font-family="Menlo, Consolas, monospace">add rax, 1</text>
      <text x="810" y="256" font-size="11" text-anchor="middle" fill="#555">rax = 18</text>
      <text x="940" y="248" font-size="16" text-anchor="middle">17</text>
      <!-- 4: A add -->
      <text x="525" y="292" text-anchor="middle" fill="#555">4</text>
      <rect x="545" y="268" width="170" height="38" rx="4" fill="#fdf0e6" stroke="#c05621"/>
      <text x="630" y="285" text-anchor="middle" font-family="Menlo, Consolas, monospace">add rax, 1</text>
      <text x="630" y="300" font-size="11" text-anchor="middle" fill="#555">rax = 18</text>
      <text x="940" y="292" font-size="16" text-anchor="middle">17</text>
      <!-- 5: B store -->
      <text x="525" y="336" text-anchor="middle" fill="#555">5</text>
      <rect x="725" y="312" width="170" height="38" rx="4" fill="#eef4fb" stroke="#2b6cb0"/>
      <text x="810" y="329" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov [count], rax</text>
      <text x="810" y="344" font-size="11" text-anchor="middle" fill="#555">writes 18</text>
      <text x="940" y="336" font-size="16" font-weight="bold" text-anchor="middle">18</text>
      <!-- 6: A store -->
      <text x="525" y="380" text-anchor="middle" fill="#555">6</text>
      <rect x="545" y="356" width="170" height="38" rx="4" fill="#fdf0e6" stroke="#b83232" stroke-width="2"/>
      <text x="630" y="373" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov [count], rax</text>
      <text x="630" y="388" font-size="11" text-anchor="middle" fill="#b83232">overwrites B's 18</text>
      <text x="940" y="380" font-size="16" font-weight="bold" text-anchor="middle" fill="#b83232">18</text>
    </g>
    <text x="745" y="432" font-size="15" font-weight="bold" text-anchor="middle" fill="#b83232">count = 18: B's increment is lost</text>
  </g>
</svg>
