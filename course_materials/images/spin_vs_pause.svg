<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585" role="img" aria-label="Why spin is slower than pause. Two threads take turns writing one shared variable. With pause, the waiting thread checks the variable now and then, so the cache line moves once per handoff. With spin, the waiting thread re-reads the variable as fast as it can; its reads pull the line back from the thread that is about to write, so the line makes extra trips and each handoff takes about twice as long.">
