<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Sixteen iterations divided into four contiguous blocks of four, one per thread. Threads 0 to 2 are on fast cores and finish at time 4. Thread 3 is on a slow core, takes twice as long per iteration, and finishes at time 8. The other threads wait at the barrier, so the loop takes 8.">
  <defs><marker id="m555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="340" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="32" font-size="19" font-weight="bold" text-anchor="middle">schedule(static): the split is decided before the loop starts</text>
    <text x="178.0" y="102.0" font-size="13" text-anchor="end" fill="#2b6cb0" font-weight="bold">thread 0</text>
    <rect x="190.0" y="80.0" width="352.0" height="34.0" rx="3" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="366.0" y="102.0" font-size="13" text-anchor="middle" fill="#222">0 1 2 3</text>
    <text x="178.0" y="150.0" font-size="13" text-anchor="end" fill="#c05621" font-weight="bold">thread 1</text>
    <rect x="190.0" y="128.0" width="352.0" height="34.0" rx="3" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="366.0" y="150.0" font-size="13" text-anchor="middle" fill="#222">4 5 6 7</text>
    <text x="178.0" y="198.0" font-size="13" text-anchor="end" fill="#2f855a" font-weight="bold">thread 2</text>
    <rect x="190.0" y="176.0" width="352.0" height="34.0" rx="3" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="366.0" y="198.0" font-size="13" text-anchor="middle" fill="#222">8 9 10 11</text>
    <text x="178.0" y="246.0" font-size="13" text-anchor="end" fill="#6b46c1" font-weight="bold">thread 3, slow core</text>
    <rect x="190.0" y="224.0" width="704.0" height="34.0" rx="3" fill="#e9e3f7" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="542.0" y="246.0" font-size="13" text-anchor="middle" fill="#222">12 13 14 15</text>
    <line x1="546.0" y1="97.0" x2="890.0" y2="97.0" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="718.0" y="91.0" font-size="12" text-anchor="middle" fill="#555" font-style="italic">waits</text>
    <line x1="546.0" y1="145.0" x2="890.0" y2="145.0" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="718.0" y="139.0" font-size="12" text-anchor="middle" fill="#555" font-style="italic">waits</text>
    <line x1="546.0" y1="193.0" x2="890.0" y2="193.0" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="718.0" y="187.0" font-size="12" text-anchor="middle" fill="#555" font-style="italic">waits</text>
    <line x1="894.0" y1="70.0" x2="894.0" y2="268.0" stroke="#222" stroke-width="3"/>
    <text x="902.0" y="266.0" font-size="13" text-anchor="start" fill="#222" font-weight="bold">loop ends at 8</text>
    <line x1="190.0" y1="290.0" x2="904.0" y2="290.0" stroke="#555" stroke-width="1.2" marker-end="url(#m555)"/>
    <line x1="190.0" y1="286.0" x2="190.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="190.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">0</text>
    <line x1="278.0" y1="286.0" x2="278.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="278.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">1</text>
    <line x1="366.0" y1="286.0" x2="366.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="366.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">2</text>
    <line x1="454.0" y1="286.0" x2="454.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="454.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">3</text>
    <line x1="542.0" y1="286.0" x2="542.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="542.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">4</text>
    <line x1="630.0" y1="286.0" x2="630.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="630.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">5</text>
    <line x1="718.0" y1="286.0" x2="718.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="718.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">6</text>
    <line x1="806.0" y1="286.0" x2="806.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="806.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">7</text>
    <line x1="894.0" y1="286.0" x2="894.0" y2="294.0" stroke="#555" stroke-width="1.2"/>
    <text x="894.0" y="309.0" font-size="12" text-anchor="middle" fill="#555">8</text>
    <text x="924.0" y="295.0" font-size="12" text-anchor="start" fill="#555">time</text>
  </g>
</svg>
