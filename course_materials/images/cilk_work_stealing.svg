<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-label="Each worker owns a deque of continuations. Workers 0, 1 and 2 push and pop at the bottom of their own deques. Worker 3&#x27;s deque is empty, so it steals the oldest continuation, at the top of worker 2&#x27;s deque.">
  <defs><marker id="m222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="m2b6cb0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="m2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="mc05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
  <rect width="1000" height="475" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="32" font-size="19" font-weight="bold" text-anchor="middle">Work stealing: four workers, four deques</text>
    <text x="140.0" y="72.0" font-size="16" text-anchor="middle" fill="#2b6cb0" font-weight="bold">worker 0</text>
    <rect x="65.0" y="132.0" width="150.0" height="148.0" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.3"/>
    <rect x="75.0" y="140.0" width="130.0" height="38.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140.0" y="164.0" font-size="12" text-anchor="middle" fill="#222">continuation (oldest)</text>
    <rect x="75.0" y="184.0" width="130.0" height="38.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140.0" y="208.0" font-size="12" text-anchor="middle" fill="#222">continuation</text>
    <rect x="75.0" y="228.0" width="130.0" height="38.0" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="140.0" y="252.0" font-size="12" text-anchor="middle" fill="#222">continuation (newest)</text>
    <text x="140.0" y="340.0" font-size="13" text-anchor="middle" fill="#2b6cb0" font-weight="bold">running</text>
    <path d="M 110 318 L 110 270" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#m2b6cb0)"/>
    <path d="M 170 270 L 170 318" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#m2b6cb0)"/>
    <text x="360.0" y="72.0" font-size="16" text-anchor="middle" fill="#c05621" font-weight="bold">worker 1</text>
    <rect x="285.0" y="132.0" width="150.0" height="148.0" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.3"/>
    <rect x="295.0" y="140.0" width="130.0" height="38.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="360.0" y="164.0" font-size="12" text-anchor="middle" fill="#222">continuation (oldest)</text>
    <rect x="295.0" y="184.0" width="130.0" height="38.0" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="360.0" y="208.0" font-size="12" text-anchor="middle" fill="#222">continuation (newest)</text>
    <text x="360.0" y="340.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="bold">running</text>
    <path d="M 330 318 L 330 226" fill="none" stroke="#c05621" stroke-width="1.8" marker-end="url(#mc05621)"/>
    <path d="M 390 226 L 390 318" fill="none" stroke="#c05621" stroke-width="1.8" marker-end="url(#mc05621)"/>
    <text x="580.0" y="72.0" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="bold">worker 2</text>
    <rect x="505.0" y="132.0" width="150.0" height="148.0" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.3"/>
    <rect x="515.0" y="140.0" width="130.0" height="38.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="580.0" y="164.0" font-size="12" text-anchor="middle" fill="#222">continuation (oldest)</text>
    <rect x="515.0" y="184.0" width="130.0" height="38.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="580.0" y="208.0" font-size="12" text-anchor="middle" fill="#222">continuation</text>
    <rect x="515.0" y="228.0" width="130.0" height="38.0" rx="4" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.5"/>
    <text x="580.0" y="252.0" font-size="12" text-anchor="middle" fill="#222">continuation (newest)</text>
    <text x="580.0" y="340.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="bold">running</text>
    <path d="M 550 318 L 550 270" fill="none" stroke="#2f855a" stroke-width="1.8" marker-end="url(#m2f855a)"/>
    <path d="M 610 270 L 610 318" fill="none" stroke="#2f855a" stroke-width="1.8" marker-end="url(#m2f855a)"/>
    <text x="800.0" y="72.0" font-size="16" text-anchor="middle" fill="#6b46c1" font-weight="bold">worker 3</text>
    <rect x="725.0" y="132.0" width="150.0" height="148.0" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.3"/>
    <text x="800.0" y="210.0" font-size="14" text-anchor="middle" fill="#555" font-style="italic">empty</text>
    <text x="800.0" y="340.0" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">idle → thief</text>
    <path d="M 646 159 C 720 110, 740 110, 790 190" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#m222)"/>
    <text x="690.0" y="104.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">steal the oldest, from the top</text>
    <text x="60.0" y="150.0" font-size="13" text-anchor="end" fill="#555">top</text>
    <text x="60.0" y="262.0" font-size="13" text-anchor="end" fill="#555">bottom</text>
    <text x="500.0" y="385.0" font-size="13" text-anchor="middle" fill="#222">push a continuation at each cilk_spawn; pop it back when the spawned call returns</text>
    <text x="500.0" y="425.0" font-size="14" text-anchor="middle" fill="#222">The owner works at the bottom, newest first. A thief takes from the top, oldest first:</text>
    <text x="500.0" y="447.0" font-size="14" text-anchor="middle" fill="#222">usually the biggest piece of unstarted work, so one steal keeps it busy for a long time.</text>
  </g>
</svg>
