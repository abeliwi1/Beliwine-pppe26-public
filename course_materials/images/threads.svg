<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Two threads in one process. Each thread has its own thread ID, stack pointer, program counter and registers, and its own stack. Both share the process's code, globals, heap and open files.">
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
  </defs>
  <rect width="1000" height="490" fill="#fff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="500" y="32" font-size="19" font-weight="bold" text-anchor="middle">Two threads in one process</text>

    <!-- thread 0 -->
    <rect x="30" y="90" width="240" height="200" rx="8" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="150" y="116" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b6cb0">thread 0, on core 0</text>
    <rect x="45" y="130" width="210" height="30" fill="#fff" stroke="#2b6cb0"/><text x="150" y="150" font-size="13" text-anchor="middle">thread ID</text>
    <rect x="45" y="166" width="210" height="30" fill="#fff" stroke="#2b6cb0"/><text x="150" y="186" font-size="13" text-anchor="middle">stack pointer</text>
    <rect x="45" y="202" width="210" height="30" fill="#fff" stroke="#2b6cb0"/><text x="150" y="222" font-size="13" text-anchor="middle">program counter</text>
    <rect x="45" y="238" width="210" height="30" fill="#fff" stroke="#2b6cb0"/><text x="150" y="258" font-size="13" text-anchor="middle">registers</text>
    <text x="150" y="312" font-size="13" text-anchor="middle" fill="#2b6cb0">private context</text>

    <!-- thread 1 -->
    <rect x="730" y="90" width="240" height="200" rx="8" fill="#fdf1e7" stroke="#c05621" stroke-width="2"/>
    <text x="850" y="116" font-size="15" font-weight="bold" text-anchor="middle" fill="#c05621">thread 1, on core 1</text>
    <rect x="745" y="130" width="210" height="30" fill="#fff" stroke="#c05621"/><text x="850" y="150" font-size="13" text-anchor="middle">thread ID</text>
    <rect x="745" y="166" width="210" height="30" fill="#fff" stroke="#c05621"/><text x="850" y="186" font-size="13" text-anchor="middle">stack pointer</text>
    <rect x="745" y="202" width="210" height="30" fill="#fff" stroke="#c05621"/><text x="850" y="222" font-size="13" text-anchor="middle">program counter</text>
    <rect x="745" y="238" width="210" height="30" fill="#fff" stroke="#c05621"/><text x="850" y="258" font-size="13" text-anchor="middle">registers</text>
    <text x="850" y="312" font-size="13" text-anchor="middle" fill="#c05621">private context</text>

    <!-- process memory -->
    <rect x="330" y="60" width="340" height="370" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
    <text x="500" y="82" font-size="15" font-weight="bold" text-anchor="middle">process memory: one address space</text>

    <text x="500" y="106" font-size="12" text-anchor="middle" fill="#555">one stack per thread</text>
    <rect x="345" y="114" width="150" height="62" rx="4" fill="#dbe9f7" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="420" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6cb0">thread 0's stack</text>
    <text x="420" y="160" font-size="12" text-anchor="middle">its local variables</text>
    <rect x="505" y="114" width="150" height="62" rx="4" fill="#fbe3d0" stroke="#c05621" stroke-width="1.5"/>
    <text x="580" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#c05621">thread 1's stack</text>
    <text x="580" y="160" font-size="12" text-anchor="middle">its local variables</text>

    <text x="500" y="214" font-size="12" text-anchor="middle" fill="#555">shared by all threads</text>
    <rect x="345" y="222" width="310" height="44" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.3"/>
    <text x="500" y="241" font-size="13" font-weight="bold" text-anchor="middle">code</text>
    <text x="500" y="258" font-size="12" text-anchor="middle" fill="#444">the instructions both threads run</text>
    <rect x="345" y="272" width="310" height="44" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.3"/>
    <text x="500" y="291" font-size="13" font-weight="bold" text-anchor="middle">global and static variables</text>
    <text x="500" y="308" font-size="12" text-anchor="middle" fill="#444">one copy: a write by either thread is seen by both</text>
    <rect x="345" y="322" width="310" height="44" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.3"/>
    <text x="500" y="341" font-size="13" font-weight="bold" text-anchor="middle">heap</text>
    <text x="500" y="358" font-size="12" text-anchor="middle" fill="#444">malloc / new, reachable by any thread</text>
    <rect x="345" y="372" width="310" height="44" fill="#e3f1e6" stroke="#2f855a" stroke-width="1.3"/>
    <text x="500" y="391" font-size="13" font-weight="bold" text-anchor="middle">open files, process ID</text>
    <text x="500" y="408" font-size="12" text-anchor="middle" fill="#444">belong to the process, not a thread</text>

    <!-- thread 0 arrows -->
    <path d="M 255 181 C 300 181, 305 150, 343 148" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a0)"/>
    <path d="M 255 217 C 300 217, 305 244, 343 244" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a0)"/>
    <path d="M 255 253 C 295 270, 300 318, 343 319" fill="none" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#a0)" marker-end="url(#a0)"/>

    <!-- thread 1 arrows -->
    <path d="M 745 181 C 700 181, 695 150, 657 148" fill="none" stroke="#c05621" stroke-width="2" marker-end="url(#a1)"/>
    <path d="M 745 217 C 700 217, 695 244, 657 244" fill="none" stroke="#c05621" stroke-width="2" marker-end="url(#a1)"/>
    <path d="M 745 253 C 705 270, 700 318, 657 319" fill="none" stroke="#c05621" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#a1)" marker-end="url(#a1)"/>

    <text x="150" y="350" font-size="12" text-anchor="middle" fill="#555">solid: points to   ·   dashed: loads and stores</text>
    <text x="850" y="350" font-size="12" text-anchor="middle" fill="#555">solid: points to   ·   dashed: loads and stores</text>

    <!-- caption -->
    <text x="500" y="460" font-size="13" text-anchor="middle" fill="#333">Each thread runs its own path through the same code, with its own registers and stack.</text>
    <text x="500" y="478" font-size="13" text-anchor="middle" fill="#333">Everything else is shared, so a variable either thread can reach may change underneath the other.</text>
  </g>
</svg>
